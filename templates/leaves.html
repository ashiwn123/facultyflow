{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">LEAVE MANAGEMENT</span><h1>{{ title }}</h1><p class="muted">Track the details and every step of the approval journey.</p></div></div><section class="card"><div class="tabs">{% for s in ['all','pending','approved','rejected','cancelled'] %}<a class="{{ 'selected' if status == s }}" href="{{ url_for('leaves',status=s,view=request.args.get('view','')) }}">{{ s|title }}</a>{% endfor %}</div>{{ leave_table(leaves,true) }}</section>{% endblock %}
